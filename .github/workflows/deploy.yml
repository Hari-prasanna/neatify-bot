name: Deploy to AWS Lambda

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./prod
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # Copy the shared utilities into the Lambda package before building.
      # SAM packages only the prod/ directory (CodeUri: ./), so src/ must
      # be present inside it at build time for `from src.utils import ...` to work.
      - name: Copy shared utilities into Lambda package
        working-directory: .
        run: cp -r src prod/

      - name: SAM Build
        run: sam build --use-container

      - name: SAM Deploy
        env:
          T_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          T_SECRET: ${{ secrets.TELEGRAM_SECRET_TOKEN }}
          T_ADMIN: ${{ secrets.ADMIN_TELEGRAM_ID }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          PARAMS="TelegramToken=$T_TOKEN \
            AdminTelegramId=$T_ADMIN \
            SupabaseUrl=$SB_URL \
            SupabaseKey=$SB_KEY"
          [[ -n "$T_SECRET" ]] && PARAMS="$PARAMS TelegramSecretToken=$T_SECRET"
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --stack-name roommate-bot-stack \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides $PARAMS

      - name: Show Webhook URL
        run: |
          echo "-------------------------------------------------------"
          echo "DEPLOYMENT COMPLETE!"
          echo "Your New Telegram Webhook URL is:"
          aws cloudformation describe-stacks \
            --stack-name roommate-bot-stack \
            --query "Stacks[0].Outputs[?OutputKey=='WebookApiUrl'].OutputValue" \
            --output text
          echo "-------------------------------------------------------"

      - name: Register Telegram Webhook
        env:
          T_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          T_SECRET: ${{ secrets.TELEGRAM_SECRET_TOKEN }}
        run: |
          WEBHOOK_URL=$(aws cloudformation describe-stacks \
            --stack-name roommate-bot-stack \
            --query "Stacks[0].Outputs[?OutputKey=='WebookApiUrl'].OutputValue" \
            --output text)

          echo "Registering webhook: $WEBHOOK_URL"

          if [[ -n "$T_SECRET" ]]; then
            BODY="{\"url\": \"$WEBHOOK_URL\", \"secret_token\": \"$T_SECRET\"}"
          else
            BODY="{\"url\": \"$WEBHOOK_URL\"}"
          fi

          curl -s -X POST "https://api.telegram.org/bot$T_TOKEN/setWebhook" \
            -H "Content-Type: application/json" \
            -d "$BODY"
